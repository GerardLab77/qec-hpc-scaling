name: Correctness and smoke
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python run_scaling.py --config configs/smoke.json --output scratch/ci
      # CI checks functionality, never enforces noisy performance thresholds.
